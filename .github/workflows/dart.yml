name: Flutter CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Java because it's required for Android builds
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Setup Flutter using the official community action
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          touch .env
          echo "SUPABASE_URL=\${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=\${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "WEB_CLIENT_ID=\${{ secrets.WEB_CLIENT_ID }}" >> .env
          echo "REVENUECAT_ANDROID_KEY=\${{ secrets.REVENUECAT_ANDROID_KEY }}" >> .env
          echo "REVENUECAT_IOS_KEY=\${{ secrets.REVENUECAT_IOS_KEY }}" >> .env
          echo "EMAIL_CONTACT=\${{ secrets.EMAIL_CONTACT }}" >> .env

      # Uncomment if you want to enforce code formatting
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed.
      - name: Run tests
        run: flutter test

      # (Optional) Verify that the app can build an APK successfully
      # - name: Build APK
      #   run: flutter build apk --debug
