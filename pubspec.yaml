name: twinfix
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  flutter_bloc: ^9.1.1
  flutter_card_swiper: ^7.2.0
  get_it: ^9.2.1
  haptic_feedback: ^0.6.4+3
  injectable: ^2.7.1+4
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  lottie: ^3.3.3
  path_provider: ^2.1.5
  photo_manager: ^3.9.0
  photo_manager_image_provider: ^2.1.0
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^6.0.0
  opencv_dart: ^2.2.1+4
  go_router: ^17.2.0
  google_fonts: ^8.0.2
  another_flushbar: ^1.12.32
  equatable: ^2.0.8
  shared_preferences: ^2.5.5
  storage_space: ^1.2.0
  video_player: ^2.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  injectable_generator: ^2.12.1
  isar_community_generator: 3.3.2
  intl_utils: ^2.8.14
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/backgrounds/
    - assets/icon/
    - assets/images/mascot/
  generate: true


flutter_intl:
  enabled: true
  class_name: S
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
