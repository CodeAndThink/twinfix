<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 20010904//EN"
 "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
 width="512.000000pt" height="512.000000pt" viewBox="0 0 512.000000 512.000000"
 preserveAspectRatio="xMidYMid meet">
<defs>
  <clipPath id="circle-clip">
    <circle cx="256" cy="256" r="256" />
  </clipPath>
  <g id="star">
    <polygon points="0,-12 3.5,-3.5 12,-3.5 5,1.5 8,10 0,5 -8,10 -5,1.5 -12,-3.5 -3.5,-3.5" fill="#F0F0F0" />
  </g>
</defs>
<g clip-path="url(#circle-clip)">
  <!-- White/Light Grey Background -->
  <circle cx="256" cy="256" r="256" fill="#F0F0F0" />
  
  <!-- Red Stripes (7 stripes) -->
  <rect x="0" y="0" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="78.77" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="157.54" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="236.31" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="315.08" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="393.85" width="512" height="39.385" fill="#D80027" />
  <rect x="0" y="472.62" width="512" height="39.385" fill="#D80027" />
  
  <!-- Blue Canton -->
  <rect x="0" y="0" width="256" height="275.69" fill="#0052B4" />
  
  <!-- 9 Stars in a 3x3 Grid -->
  <use href="#star" x="64" y="68.92" />
  <use href="#star" x="128" y="68.92" />
  <use href="#star" x="192" y="68.92" />
  
  <use href="#star" x="64" y="137.84" />
  <use href="#star" x="128" y="137.84" />
  <use href="#star" x="192" y="137.84" />
  
  <use href="#star" x="64" y="206.76" />
  <use href="#star" x="128" y="206.76" />
  <use href="#star" x="192" y="206.76" />
</g>
</svg>
